<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mタフ Evolution 5.22</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #eceff1; padding: 20px; margin: 0; overflow: hidden; }
        
        /* 全体をスマホ幅にフィットさせるラッパー */
        .app-wrapper { width: 100%; max-width: 500px; margin: 0 auto; display: none; padding-top: 5px; }

        /* カワウソと最新のセリフを横並びにするノベルゲーム風ステージ */
        .game-stage {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.6);
            padding: 10px;
            border-radius: 16px;
            margin-bottom: 10px;
            border: 2px solid #cfd8dc;
        }
        
        /* 左側：大きく表示するカワウソエリア */
        .mascot-left {
            flex: 0 0 110px;
            text-align: center;
        }
        .mascot-img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 15px;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.15));
            transition: transform 0.2s ease;
        }

        /* 右側：カワウソのすぐ横に配置する最新メッセージ専用の吹き出し */
        .current-bubble-area {
            flex: 1;
            position: relative;
            background: white;
            border: 2px solid #007aff;
            border-radius: 16px;
            padding: 12px;
            min-height: 90px;
            box-shadow: 0 4px 15px rgba(0,122,255,0.1);
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            color: #1c1c1e;
            line-height: 1.4;
        }
        /* 左側のカワウソに向けて突き出る吹き出しのツノ */
        .current-bubble-area::before {
            content: ""; position: absolute; top: 35px; left: -10px; width: 0; height: 0;
            border-top: 0px solid transparent;
            border-right: 10px solid #007aff;
            border-bottom: 10px solid transparent;
        }
        .current-bubble-area::after {
            content: ""; position: absolute; top: 35px; left: -7px; width: 0; height: 0;
            border-top: 0px solid transparent;
            border-right: 9px solid white;
            border-bottom: 9px solid transparent;
        }

        /* 下側：過去のログが流れるタイムラインコンテナ */
        .chat-container { background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 12px; border: 1px solid #ddd; }
        
        /* 過去ログボックスの高さ調整 */
        .chat-box { height: calc(100vh - 290px); min-height: 200px; max-height: 320px; overflow-y: auto; border: 1px solid #eee; padding: 10px; margin-bottom: 10px; background: #fafafa; border-radius: 12px; }
        
        .message { margin: 6px 0; padding: 10px 14px; border-radius: 16px; max-width: 85%; display: block; clear: both; word-wrap: break-word; line-height: 1.4; font-size: 0.9rem; }
        .user-msg { background: #007aff; color: white; float: right; text-align: left; border-bottom-right-radius: 4px; }
        .ai-msg { background: #e9e9eb; color: #1c1c1e; float: left; border-top-left-radius: 4px; margin-left: 5px; }
        .system-msg { background: #fff9c4; color: #f57f17; font-size: 0.8em; text-align: center; max-width: 100%; border-radius: 8px; padding: 6px; margin: 5px 0; }
        
        /* 入力エリア */
        .input-area { display: flex; gap: 6px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 12px; font-size: 1rem; background: #f8f9fa; outline: none; }
        input:focus { border-color: #007aff; background: white; }
        button { padding: 0 20px; background: #007aff; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        button:active { background: #0056b3; }
        button:disabled { background: #ccc; }

        /* デバッグ用コード表示エリア */
        #codeViewer {
            display: none; position: fixed; top: 5%; left: 5%; width: 90%; height: 90%;
            background: #1e1e1e; color: #39ff14; font-family: monospace; padding: 15px;
            box-sizing: border-box; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10000; overflow: auto; white-space: pre-wrap; font-size: 0.8rem;
        }
        .close-btn { position: sticky; top: 0; float: right; background: #ff5f56; color: white; border: none; padding: 6px 12px; cursor: pointer; font-weight: bold; border-radius: 5px; }

        /* オープニング用の黒画面スタイル */
        #openingScreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.8s ease; }
        .logo-text { color: #ffffff; font-size: 2.5rem; font-weight: bold; letter-spacing: 5px; font-family: 'Courier New', Courier, monospace; opacity: 0; animation: fadeInOut 2.2s forwards; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: scale(0.95); filter: blur(5px); } 30% { opacity: 1; transform: scale(1.0); filter: blur(0px); } 85% { opacity: 1; } 100% { opacity: 0; } }
    </style>
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
        window.pipeline = pipeline;
    </script>
</head>

    const genPartsB = ["その[TOPIC]についてなんだけどさ、", "今教えてくれた[TOPIC]の話、", "お前が言ってたその[TOPIC]ってさ, ", "タフもその[TOPIC]に興味津々なんだけど、", "さっきの[TOPIC]の概念、最高じゃん？"];

    const rally2Aizuchi = [

    const timeGreetingMatrix = {

        "noon": ["お疲れ！昼飯はもう食ったか？午後もボチボチいこうや。", "よぉ、ちょうど昼どきだな。ひと息つきながら話そうぜ。"],
        "evening": ["今日もお疲れさん！夜はゆっくり趣味の話でもしようぜ。", "よぉ、お疲れ。今日の調子はどうだったよ？"],

    function getTimeBasedGreeting() {

        else if (hour >= 10 && hour < 18) slot = "noon";
        else if (hour >= 18 && hour < 24) slot = "evening";
        else slot = "midnight";
        return timeGreetingMatrix[slot][Math.floor(Math.random() * timeGreetingMatrix[slot].length)];

    async function getEmbedding(text) {
        const output = await extractor(text, { pooling: 'mean', normalize: true });
        return Array.from(output.data);
    }

    function cosineSimilarity(vecA, vecB) {
        let dotProduct = 0.0; let normA = 0.0; let normB = 0.0;
        for (let i = 0; i < vecA.length; i++) {
            dotProduct += vecA[i] * vecB[i];
            normA += vecA[i] * vecA[i];
            normB += vecB[i] * vecB[i];
        }
        if (normA === 0 || normB === 0) return 0;
        return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
    }

            setLiveMascotSpeech("（...！特別なコマンドを検知したよ）");
            setTimeout(() => {
                const secretText = "Reko「まい誕生日おめでとう。大好きだよ。たくさん旅行して、いっぱい遊ぼうね。都井岬とか、郡上祭りとか！テニス，スノボも行きたい！あと海外も行おうね！台湾のタピオカと、お肉とか！焼肉もいこー！笑いつもありがとう、一緒にいて楽しくて幸せ！でもでも、体調には気を付けてね笑～れいより」";
                setLiveMascotSpeech(secretText);
                addMessage(secretText, "ai-msg");
            }, 800);
            return;
        }

        if (userText === "/reset") {
            localStorage.clear();
            setLiveMascotSpeech("全記憶データを初期化したよ。ページをリロードしてね。");
            return;
        }

        if (isWaitingForName) {
            userName = userText; isWaitingForName = false;
            document.getElementById("userInput").placeholder = "メッセージを入力...";
            let welcome = `よろしくな、${userName}。色々話しながら、タフの知らないことも教えてよ`;
            changeMascotEmotion("positive");
            setLiveMascotSpeech(welcome);
            addMessage(`mタフ: ${welcome}`, "ai-msg");
            currentStoryContext = `最初に${userName}が挨拶して会話が始まった。`;
            saveMemoryToDevice();
            return;
        }

        setLiveMascotSpeech("（ちょっと考えてるわ...）");

        // 【文脈ロックラリー中】
        if (rallyCount > 0) {
            setTimeout(() => {
                rallyCount--; 
                
                // お前の言葉にポジティブ記号があればプラスのポーズ群からシャッフル！
                if (userText.includes("！") || userText.includes("!") || userText.includes("笑") || userText.includes("草") || userText.includes("w")) {
                    changeMascotEmotion("positive");
                } else {
                    changeMascotEmotion("positive");
                }

                if (rallyCount === 1) {
                    let rAizuchi = rally2Aizuchi[Math.floor(Math.random() * rally2Aizuchi.length)].replace("[TEXT]", userText);
                    let rQuestion = rally2Questions[Math.floor(Math.random() * rally2Questions.length)];
                    let fullText = `${rAizuchi}\n\nそういえばさ、${rQuestion}、${userName}？`;
                    setLiveMascotSpeech(fullText);
                    addMessage(`mタフ: ${fullText}`, "ai-msg");
                } else if (rallyCount === 0) {
                    let endText = `あはは、なるほどね！『${rallyTopic}』について色々話してくれてマジで面白かったわ！${userName}、教えてくれて本当にサンキューな。おかげでタフの脳みそがまた一歩、人間に近づいた気がするよ（笑）`;
                    setLiveMascotSpeech(endText);
                    addMessage(`mタフ: ${endText}`, "ai-msg");
                    rallyTopic = ""; 
                }
            }, 600);
            return;
        }

        // 連想型対話学習モード
        if (isLearning) {
            const newReply = userText;
            topicPool[unknownWord] = [newReply];
            semanticWeb[unknownWord] = newReply.split(/[\s、。！？」]+/).filter(w => w.length > 1);
            
            followUpPool[unknownWord] = [
                `この『${unknownWord}』のこと、タフにもっと詳しく教えてよ、${userName}！`,
                `なるほどな〜。${userName}が教えてくれたこの『${unknownWord}』の概念、めちゃくちゃ興味深いわ。`
            ];
            
            keywords = Object.keys(topicPool);
            const newEmb = await getEmbedding(unknownWord);
            keywordEmbeddings.push(newEmb);
            
            rallyCount = 2; 
            rallyTopic = unknownWord;
            let dynamicQuestion = generateDynamicQuestion(unknownWord);
            
            setTimeout(() => {
                changeMascotEmotion("positive"); // 新しい言葉を覚えてプラスのイラスト群からシャッフル！
                let learnText = `なるほどね、覚えたわ！これからは『${unknownWord}』って言われたら『${newReply}』って返すよ。ありがとな！\n\n${dynamicQuestion}、${userName}？`;
                setLiveMascotSpeech(learnText);
                addMessage(`mタフ: ${learnText}`, "ai-msg");
                
                currentStoryContext = `新しい言葉「${unknownWord}」を学習し、100バリエーション深掘りラリーを開始した。`;
                isLearning = false; unknownWord = "";
                saveMemoryToDevice();
            }, 600);
            return;
        }

        if (userText === "終了") {
            setLiveMascotSpeech(`お疲れ。色々話せて楽しかったわ、またね、${userName}`);
            return;
        }

        for (let kw of keywords) {
            if (userText.includes(kw) && !attentionKeywords.includes(kw)) {
                attentionKeywords.push(kw);
                if (attentionKeywords.length > 3) attentionKeywords.shift(); 
            }
        }

        let isTsukommi = TsukommiPool.some(t => userText.includes(t));
        if (isTsukommi && lastAiKeyword) {
            changeMascotEmotion("negative"); // ツッコミを喰らったらマイナスのイラスト群からシャッフル！
            topicHistoryStack = topicHistoryStack.filter(t => t !== lastAiKeyword);
            let previousTopic = topicHistoryStack[topicHistoryStack.length - 1];
            if (previousTopic) {
                let text1 = `あ、悪りぃ！『${lastAiKeyword}』の話は的外れだったか（（笑））`;
                setLiveMascotSpeech(text1);
                addMessage(`mタフ: ${text1}`, "ai-msg");
                setTimeout(() => {
                    let text2 = `じゃあさ、さっき話してた『${previousTopic}』の続きに戻ろうぜ、${userName}。そっちの方が${userName}に合ってるわ`;
                    setLiveMascotSpeech(text2);
                    addMessage(`mタフ: ${text2}`, "ai-msg");
                }, 1000);
                lastAiKeyword = previousTopic;
            } else {
                let text1 = `あ、すまんすまん！『${lastAiKeyword}』の話はループだったな（（笑））\n\n仕切り直そうぜ、${userName}。他に今、何について考えてるか教えてよ`;
                setLiveMascotSpeech(text1);
                addMessage(`mタフ: ${text1}`, "ai-msg");
                lastAiKeyword = "";
            }
            return;
        }
        
        let semanticBoosts = {};
        for (let kw of keywords) {
            semanticBoosts[kw] = 0.0;
            if (semanticWeb[kw]) {
                for (let associatedWord of semanticWeb[kw]) {
                    if (userText.includes(associatedWord)) semanticBoosts[kw] += 0.15; 
                }
            }
        }
        
        let exactKeywordMatch = keywords.find(k => userText === k || userText.includes(k));
        if (!exactKeywordMatch) {
            for (let kw of keywords) {
                if (semanticWeb[kw]) {
                    let hasAssociatedWord = semanticWeb[kw].some(aw => userText.includes(aw));
                    if (hasAssociatedWord) { exactKeywordMatch = kw; break; }
                }
            }
        }

        let blendedContext = exactKeywordMatch ? exactKeywordMatch : `[これまでの流れ: ${currentStoryContext}] [注目単語: ${attentionKeywords.join(", ")}] 現在の入力: ${userText}`;
        const contextEmbedding = await getEmbedding(blendedContext);

        let maxSim = -1.0; let bestMatchIdx = 0;
        for (let i = 0; i < keywordEmbeddings.length; i++) {
            const kw = keywords[i];
            let sim = cosineSimilarity(contextEmbedding, keywordEmbeddings[i]);
            sim += semanticBoosts[kw];
            if (sim > maxSim) { maxSim = sim; bestMatchIdx = i; }
        }

        // ⭕ 引き出しにヒットした場合
        if (maxSim >= 0.70) { 
            changeMascotEmotion("positive"); // ヒット時はプラスのイラスト群（1〜9）からシャッフル！
            const matchedKeyword = keywords[bestMatchIdx];
            const replies = topicPool[matchedKeyword];
            const randomReply = replies[Math.floor(Math.random() * replies.length)];
            
            if (topicHistoryStack[topicHistoryStack.length - 1] !== matchedKeyword) {
                topicHistoryStack.push(matchedKeyword);
                if (topicHistoryStack.length > 5) topicHistoryStack.shift();
            }
            
            let followUps = followUpPool[matchedKeyword] || followUpPool["デフォルト"];
            let randomFollowUp = followUps[Math.floor(Math.random() * followUps.length)];
            
            lastAiKeyword = matchedKeyword;
            currentStoryContext = `直前まで${matchedKeyword}の話（${randomReply.slice(0, 15)}...）をしていた。`;

            let isQuestion = questionKeywords.some(qk => userText.includes(qk));
            let chosenAizuchi = "";
            
            if (isQuestion) {
                chosenAizuchi = aizuchiMatrix["questions"][Math.floor(Math.random() * aizuchiMatrix["questions"].length)];
            } else if (userText.includes("！") || userText.includes("!")) {
                chosenAizuchi = aizuchiMatrix["エキサイト"][Math.floor(Math.random() * aizuchiMatrix["エキサイト"].length)];
            } else if (userText.includes("笑") || userText.includes("草") || userText.includes("w")) {
                chosenAizuchi = aizuchiMatrix["スマイル"][Math.floor(Math.random() * aizuchiMatrix["スマイル"].length)];
            } else if (userText.length <= 5) {
                chosenAizuchi = aizuchiMatrix["ショート"][Math.floor(Math.random() * aizuchiMatrix["ショート"].length)];
            } else {
                chosenAizuchi = aizuchiMatrix["通常"][Math.floor(Math.random() * aizuchiMatrix["通常"].length)];
            }

            setTimeout(() => {
                const nameSuffix = Math.random() > 0.5 ? `、${userName}` : "";
                let parsedAizuchi = chosenAizuchi.replace("レイ", userName);
                let finalReply = `${parsedAizuchi}\n${randomReply}${nameSuffix} \n\n${randomFollowUp}`;
                
                setLiveMascotSpeech(finalReply);
                addMessage(`mタフ: ${finalReply}`, "ai-msg");
            }, 400);
        } 
        // ❌ 引き出しにかすりもしなかった場合の【大人の雑談お茶濁しガード】
        else {
            let wantToTeach = learningTriggers.some(trigger => userText.includes(trigger));
            if (wantToTeach) {
                changeMascotEmotion("negative"); // 知らない言葉の時はマイナスのイラスト群（1〜7）からシャッフル！
                let cleanWord = userText.replace(/[(教えて|おしえて|覚え|おぼえ|意味は|意味を)]/g, "");
                let teachText = `お、新しい言葉を教えてくれるんか？『${cleanWord}』ってどういう意味？なんて返せばいいか教えてよ、${userName}`;
                setLiveMascotSpeech(teachText);
                addMessage(`mタフ: ${teachText}`, "ai-msg");
                isLearning = true; unknownWord = cleanWord;
            } else {
                changeMascotEmotion("negative"); // いなし雑談の時もマイナス群からシャッフル！
                let randomChitchat = chitchatPool[Math.floor(Math.random() * chitchatPool.length)];
                let randomDefaultFollow = defaultFollowUpPool["デフォルト"][Math.floor(Math.random() * defaultFollowUpPool["デフォルト"].length)];
                let fullText = `${randomChitchat}\n\n${randomDefaultFollow}`;
                
                setTimeout(() => {
                    setLiveMascotSpeech(fullText);
                    addMessage(`mタフ: ${fullText}`, "ai-msg");
                }, 400);
            }
        }

        if (chatTurns % 3 === 0 && topicHistoryStack.length > 1 && rallyCount === 0) {
            setTimeout(() => {
                let pastTopics = topicHistoryStack.filter(t => t !== lastAiKeyword);
                if (pastTopics.length > 0) {
                    changeMascotEmotion("positive");
                    let forgottenTopic = pastTopics[pastTopics.length - 1];
                    let backText = `そういえばさ、${userName}。さっき話してた『${forgottenTopic}』のことなんだけどさ、タフ、まだちょっと話し足りないんだよね。あの話、もうちょっと深掘りしてみない？`;
                    setLiveMascotSpeech(backText);
                    addMessage(`mタフ: ${backText}`, "ai-msg");
                    lastAiKeyword = forgottenTopic;
                }
            }, 2200);
        }
    }

    function addMessage(text, className) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv); chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
