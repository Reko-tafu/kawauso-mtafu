    async function getEmbedding(text) {

    function cosineSimilarity(vecA, vecB) {
        let dotProduct = 0.0; let normA = 0.0; let normB = 0.0;
        for (let i = 0; i < vecA.length; i++) {
            dotProduct += vecA[i] * vecB[i];
            normA += vecA[i] * vecA[i];
            normB += vecB[i] * vecB[i];
        }
        if (normA === 0 || normB === 0) return 0;
        return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
    }

        }

        // Moodシステム
        let isTsukommi = TsukommiPool.some(t => userText.includes(t));
        let isShortReply = userText.length <= 3 && !userText.includes("！") && !userText.includes("!");
        
        if (isTsukommi) mtafuMood -= 15;
        else if (isShortReply) mtafuMood -= 5;
        else if (userText.includes("！") || userText.includes("!") || userText.includes("笑") || userText.includes("草") || userText.includes("w")) mtafuMood += 8;
        mtafuMood = Math.max(0, Math.min(100, mtafuMood));

        setLiveMascotSpeech("（ちょっと考えてるわ...）");

        if (rallyCount > 0) {
            setTimeout(() => {
                rallyCount--; 
                changeMascotEmotion("positive");
                if (rallyCount === 1) {
                    let rAizuchi = rally2Aizuchi[Math.floor(Math.random() * rally2Aizuchi.length)].replace("[TEXT]", userText);
                    let rQuestion = rally2Questions[Math.floor(Math.random() * rally2Questions.length)];
                    setLiveMascotSpeech(`${rAizuchi}\n\nそういえばさ、${rQuestion}、${userName}？`);
                } else if (rallyCount === 0) {
                    setLiveMascotSpeech(`あはは、なるほどね！『${rallyTopic}』について色々話してくれてマジで面白かったわ！${userName}、教えてくれて本当にサンキューな。`);
                    rallyTopic = ""; 
                }
            }, 600);
            return;
        }

        if (isLearning) {
            const newReply = userText;
            topicPool[unknownWord] = [newReply];
            let extractedWords = newReply.split(/[\s、。！？」]+/).filter(w => w.length > 1);
            semanticWeb[unknownWord] = extractedWords;
            
            const coreGenres = ["ゲーム", "生物・遺伝", "古生物・化石", "データサイエンス"];
            let maxGenreSim = -1.0; let bestGenre = "";
            const replyEmbedding = await getEmbedding(newReply);
            for (let genre of coreGenres) {
                let genreIdx = keywords.indexOf(genre);
                if (genreIdx !== -1) {
                    let sim = cosineSimilarity(replyEmbedding, keywordEmbeddings[genreIdx]);
                    if (sim > maxGenreSim) { maxGenreSim = sim; bestGenre = genre; }
                }
            }
            let dynamicComment = "";
            if (maxGenreSim >= 0.40 && bestGenre) {
                if (!semanticWeb[bestGenre].includes(unknownWord)) semanticWeb[bestGenre].push(unknownWord);
                dynamicComment = `\n\n（タフの脳内：ふむふむ、これって『${bestGenre}』のジャンルに近い概念だな…！）`;
                mtafuMood += 10;
            }
            
            followUpPool[unknownWord] = [`この『${unknownWord}』のこと、タフにもっと詳しく教えてよ、${userName}！`];
            keywords = Object.keys(topicPool);
            const newEmb = await getEmbedding(unknownWord);
            keywordEmbeddings.push(newEmb);
            
            rallyCount = 2; rallyTopic = unknownWord;
            let dynamicQuestion = generateDynamicQuestion(unknownWord);
            
            setTimeout(() => {
                changeMascotEmotion("positive");
                setLiveMascotSpeech(`なるほどね、覚えたわ！これからは『${unknownWord}』って言われたら『${newReply}』って返すよ。ありがとな！${dynamicComment}\n\n${dynamicQuestion}、${userName}？`);
                isLearning = false; unknownWord = "";
                saveMemoryToDevice();
            }, 600);
            return;
        }

        for (let kw of keywords) {
            if (userText.includes(kw) && !attentionKeywords.includes(kw)) {
                attentionKeywords.push(kw);
                if (attentionKeywords.length > 3) attentionKeywords.shift(); 
                mtafuMood += 3;
            }
        }

        if (isTsukommi && lastAiKeyword) {
            changeMascotEmotion("negative"); 
            topicHistoryStack = topicHistoryStack.filter(t => t !== lastAiKeyword);
            setTimeout(() => {
                setLiveMascotSpeech(mtafuMood < 30 ? `チッ、うるせーな（（笑））『${lastAiKeyword}』の話が違うならもういいよ。` : `あ、悪りぃ！『${lastAiKeyword}』の話は的外れだったか（笑）仕切り直そうぜ。`);
            }, 400);
            return;
        }
        
        let semanticBoosts = {};
        for (let kw of keywords) {
            semanticBoosts[kw] = 0.0;
            if (semanticWeb[kw]) {
                for (let associatedWord of semanticWeb[kw]) {
                    if (userText.includes(associatedWord)) semanticBoosts[kw] += 0.15; 
                }
            }
        }

        if (!window.userChatHistoryStack) window.userChatHistoryStack = [];
        window.userChatHistoryStack.push(userText);
        if (window.userChatHistoryStack.length > 3) window.userChatHistoryStack.shift(); 

        let pastContextKeywords = attentionKeywords.join("、");
        let blendedContext = `[直前のトピック: ${pastContextKeywords}] [これまでの流れ: ${window.userChatHistoryStack.slice(0, -1).join(" → ")}] [現在の入力: ${userText}]`;

        const contextEmbedding = await getEmbedding(blendedContext);

        let maxSim = -1.0; let bestMatchIdx = 0;
        for (let i = 0; i < keywordEmbeddings.length; i++) {
            const kw = keywords[i];
            let sim = cosineSimilarity(contextEmbedding, keywordEmbeddings[i]);
            if (window.userChatHistoryStack.some(h => h.includes(kw))) sim += 0.1;
            sim += semanticBoosts[kw];
            if (sim > maxSim) { maxSim = sim; bestMatchIdx = i; }
        }

        // ⭕ 引き出しにヒットした場合（これまでの爆速合成エンジンで返す）
        if (maxSim >= 0.70) { 
            changeMascotEmotion(mtafuMood >= 40 ? "positive" : "negative"); 
            const matchedKeyword = keywords[bestMatchIdx];
            const replies = topicPool[matchedKeyword];
            let baseReply = replies[Math.floor(Math.random() * replies.length)];
            
            if (topicHistoryStack[topicHistoryStack.length - 1] !== matchedKeyword) {
                topicHistoryStack.push(matchedKeyword);
                if (topicHistoryStack.length > 5) topicHistoryStack.shift();
            }
            
            lastAiKeyword = matchedKeyword;
            let isQuestion = questionKeywords.some(qk => userText.includes(qk));
            let chosenAizuchi = isQuestion ? aizuchiMatrix["questions"][Math.floor(Math.random() * aizuchiMatrix["questions"].length)] : aizuchiMatrix["通常"][Math.floor(Math.random() * aizuchiMatrix["通常"].length)];

            setTimeout(() => {
                const nameSuffix = Math.random() > 0.5 ? `、${userName}` : "";
                let parsedAizuchi = chosenAizuchi.replace("レイ", userName);
                let rawWord = userText.replace(/[(って|について|の|は|が|を|も|教えて|どう思う|？|\?)]/g, "").trim();
                if (!rawWord || rawWord.length <= 1) rawWord = matchedKeyword;
                
                let simulatedReply = baseReply.replace(/\[WORD\]/g, rawWord);
                let randomJoin = synthesisParts[mtafuMood >= 75 ? "excited_joins" : "joins"][Math.floor(Math.random() * synthesisParts["joins"].length)];
                
                let finalReply = "";
                if (mtafuMood < 30) {
                    finalReply = `（機嫌：${mtafuMood} / 不機嫌）\n\n${synthesisParts["sullen_replies"][Math.floor(Math.random() * synthesisParts["sullen_replies"].length)]}`;
                } else {
                    if (isQuestion) {
                        let randomEnding = synthesisParts["endings_normal"][Math.floor(Math.random() * synthesisParts["endings_normal"].length)];
                        finalReply = `（機嫌：${mtafuMood}）\n\n${parsedAizuchi}\n${simulatedReply}${nameSuffix}\n\n${randomJoin}${rawWord}${randomEnding}`;
                    } else {
                        let randomEnding = synthesisParts["endings_question"][Math.floor(Math.random() * synthesisParts["endings_question"].length)];
                        let randomFollowUp = defaultFollowUpPool["デフォルト"][0];
                        finalReply = `（機嫌：${mtafuMood}）\n\n${parsedAizuchi}\n${simulatedReply}${nameSuffix}\n\n${randomJoin}${rawWord}${randomEnding}\n${randomFollowUp}`;
                    }
                }
                setLiveMascotSpeech(finalReply);
            }, 400);
        } 
        // 🌟【新機軸】引き出しにない場合：ネット検索 ＋ 完全ローカル生成AIによる「解釈生成」ルート発動！
        else {
            let searchQuery = userText.replace(/[(教えて|おしえて|意味は|意味を|について|って|何|？|\?)]/g, "").trim();
            if (searchQuery.length > 1) {
                const webSnippet = await searchWebKnowledge(searchQuery);
                
                if (webSnippet) {
                    changeMascotEmotion("positive");
                    setLiveMascotSpeech("（裏でネットを検索したわ。今、頭の中で解釈を組み立てているから、数秒〜十数秒ちょっと待ってな...）");

                    // 🧠ブラウザの中のAIに「タフになりきって、この検索結果を解釈しろ」と命令文を作る（Chatプロンプト）
                    const prompt = `<|im_start|>system
お前は少し生意気でフランクなカワウソのキャラクター「タフ」だ。
敬語は絶対に使うな。「〜だわ」「〜じゃん？」「（笑）」などの男らしいフランクな口調で喋れ。
次の【ネットの情報】を読んで、その内容を1文だけでレイに分かりやすく解釈・説明してあげて。<|im_end|>
<|im_start|>user
【ネットの情報】:${webSnippet}<|im_end|>
<|im_start|>assistant\n`;

                    try {
                        // 🌟ローカルの生成AIをここで実際にフル稼働させて、文字を作らせる！
                        const output = await generator(prompt, {
                            max_new_tokens: 70,
                            temperature: 0.6,
                            do_sample: true
                        });

                        // 生成された完全オリジナルの解釈文をパース
                        let rawGeneratedText = output[0].generated_text;
                        let generatedReply = rawGeneratedText.split('<|im_start|>assistant\n').pop().replace(/<\|im_end\|>/g, "").trim();

                        let webReply = `（機嫌：${mtafuMood} / 🌐ローカルLLM思考解釈モード）\n\nおっと、その話はタフの脳内に知恵がなかったから、今ネットで調べてタフなりに解釈してみたわ！\n\n${generatedReply}\n\nぶっちゃけネットのデータにはそう書いてあったけど、お前はどう思うよ？`;
                        setLiveMascotSpeech(webReply);
                        return;
                    } catch (genError) {
                        console.error("文字生成エラー:", genError);
                        setLiveMascotSpeech("あちゃー、頭の中で文字を組み立てる計算がパンクしちまったわ（笑）");
                        return;
                    }
                }
            }

            // 検索・生成ともに動かなかった場合のセーフティ
            changeMascotEmotion("negative"); 
            let fullText = mtafuMood < 30 ? `（機嫌：${mtafuMood}）\n\nなんか今つまらんわ。もっとおもろい話してや（（笑））` : `（機嫌：${mtafuMood}）\n\n${chitchatPool[Math.floor(Math.random() * chitchatPool.length)]}\n\n${defaultFollowUpPool["デフォルト"][Math.floor(Math.random() * defaultFollowUpPool["デフォルト"].length)]}`;
            setLiveMascotSpeech(fullText);
        }
    }
</script>
